name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 技術スタック決定後に、install / lint / test のステップを追加してください。
  # 例 (Node.js):
  #   - uses: actions/setup-node@v4
  #     with: { node-version: 20, cache: npm }
  #   - run: npm ci
  #   - run: npm run lint
  #   - run: npm test
  # 例 (Python):
  #   - uses: actions/setup-python@v5
  #     with: { python-version: "3.12" }
  #   - run: pip install -r requirements.txt
  #   - run: pytest
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env ファイルがコミットされています"
            exit 1
          fi

      - name: Placeholder
        run: echo "スタック決定後に lint / test を追加してください"
